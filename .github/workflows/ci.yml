name: CI Quality Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: Code Quality & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint Static Analysis
        run: npm run lint

      - name: Prettier Code Format Check
        run: npm run format:check

      - name: TypeScript Type Check
        run: npm run type-check

      - name: Unit & Logic Test with Coverage Check (Jest)
        run: npm run test:coverage

      - name: Output Coverage Summary to Job Summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "### 📊 Code Coverage Summary (Target: >=90%)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            node -e '
              const summary = require("./coverage/coverage-summary.json").total;
              console.log(`Lines:      ${summary.lines.pct}% (${summary.lines.covered}/${summary.lines.total})`);
              console.log(`Statements: ${summary.statements.pct}% (${summary.statements.covered}/${summary.statements.total})`);
              console.log(`Functions:  ${summary.functions.pct}% (${summary.functions.covered}/${summary.functions.total})`);
              console.log(`Branches:   ${summary.branches.pct}% (${summary.branches.covered}/${summary.branches.total})`);
            ' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high || true

      - name: Expo Web Build Export Test
        run: npm run build:web
